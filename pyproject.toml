[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-multi-agent"
version = "0.1.0"
description = "QUANTUM: Multi-Agent Cryptocurrency Perpetual Futures Desktop Trading Desk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "QUANTUM Engineering Team" }
]
dependencies = [
    "PySide6-Essentials>=6.5.0",
    "qasync>=0.27.0",
    "aiosqlite>=0.19.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
